name: CRM Core Smoke Test
on:
  push:
    branches: [main]
    paths:
      - index.html
      - crm-v3.js
      - crm-api.js
      - crm-formulas.js
      - crm-sheet-studio.js
      - crm-sheet-features.js
      - crm-sheet-offline.js
      - crm-v3.css
      - tests/sheets-studio.cjs
      - tests/crm-smoke.cjs
      - .github/workflows/crm-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check crm-api.js
          node --check crm-v3.js
          node --check crm-formulas.js
          node --check crm-sheet-studio.js
          node --check crm-sheet-features.js
          node --check crm-sheet-offline.js
      - name: Install pinned DOM test dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock jsdom@26.1.0 fake-indexeddb@6.2.7 @formulajs/formulajs@4.6.1
      - name: Test CRM workflow against simulated Supabase
        run: |
          node tests/crm-smoke.cjs
          node tests/sheets-studio.cjs
