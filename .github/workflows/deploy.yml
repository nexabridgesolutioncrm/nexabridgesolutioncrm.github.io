name: Deploy NexaBridge CRM

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current CRM source
        uses: actions/checkout@v4
      - name: Validate and stage current version
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'nexa-login-brand' index.html
          grep -q 'authForm' index.html
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload current CRM
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy current CRM
        id: deployment
        uses: actions/deploy-pages@v4
