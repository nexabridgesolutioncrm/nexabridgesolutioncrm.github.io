name: Promote verified CRM release to Pages branch
on:
  push:
    paths:
      - .github/workflows/promote.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify release
        shell: bash
        run: |
          set -euo pipefail
          cat release/part{1,2,3,4}.txt | base64 -d > /tmp/crm.br
          node -e 'const fs=require("node:fs");const z=require("node:zlib");fs.writeFileSync("index.html",z.brotliDecompressSync(fs.readFileSync("/tmp/crm.br")))'
          echo '6c82b8403fc9fd45d799ecbbac3c7c0cf961668b6ea7b57dc885d83f63e9cec9  index.html' | sha256sum -c -
      - name: Update root file for branch-based GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --staged --quiet; then
            echo 'CRM release already promoted'
          else
            git commit -m 'Promote validated professional CRM to Pages root'
            git push origin HEAD:main
          fi
