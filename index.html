function docCost(lines,discount=0,tax=0){
 const subtotalCents=lines.reduce((n,x)=>n+Math.round(Number(x.quantity||0)*Number(x.unit_price||0)*100),0);
 const discountCents=Math.round(Number(discount||0)*100);
 const taxCents=Math.round(Math.max(0,subtotalCents-discountCents)*Number(tax||0)/100);
 return {subtotal:subtotalCents/100,discount:discountCents/100,tax:taxCents/100,total:(subtotalCents-discountCents+taxCents)/100};
}

function opsEditor(kind,id=null){
 const cfg=OPS[kind],r=id?data[kind].find(x=>x.id===id):{};
 closeModal();
 const make=([key,label,type='text',required=false])=>{
  const value=r?.[key]??'';
  let control;
  if(Array.isArray(type))control='<select name="'+key+'">'+type.map(opt=>'<option value="'+opt+'" '+(String(value)===opt?'selected':'')+'>'+opt.replaceAll('_',' ')+'</option>').join('')+'</select>';
  else if(type==='client'||type==='job'){const rows=data[type==='client'?'clients':'jobs'];control='<select name="'+key+'"><option value="">Select '+type+'</option>'+rows.map(x=>'<option value="'+e(x.id)+'" '+(value===x.id?'selected':'')+'>'+e(x.name||x.title)+'</option>').join('')+'</select>'}
  else if(type==='textarea')control='<textarea name="'+key+'">'+e(value)+'</textarea>';
  else control='<input name="'+key+'" type="'+type+'" value="'+e(type==='datetime-local'&&value?String(value).slice(0,16):value)+'" '+(required?'required':'')+(type==='number'?' min="0" step="0.01"':'')+'>';
  return '<div class="field"><label>'+label+'</label>'+control+'</div>';
 };
 modalWindow((id?'Edit ':'New ')+cfg.title,'<form id="opsForm"><div class="form-grid">'+cfg.fields.map(make).join('')+'</div></form>','<button class="btn neutral" data-action="closeModal">Cancel</button><button class="btn primary" form="opsForm">Save</button>');

  ev.preventDefault();const body=Object.fromEntries(new FormData(ev.target));
  for(const [k,label,type] of cfg.fields){if(type==='datetime-local'&&body[k])body[k]=new Date(body[k]).toISOString();if(type==='date'&&body[k]==='')body[k]=null;if(type==='client'||type==='job'){if(body[k]==='')body[k]=null}}
  for(const n of ['unitPrice','unitCost','reorderPoint','intervalDays','price','hourlyRate'])if(n in body)body[n]=Number(body[n]||0);
  for(const n of ['taxable','active','isDone'])if(n in body)body[n]=body[n]==='true';
  if(kind==='time_entries'&&new Date(body.endedAt)<=new Date(body.startedAt))return notify('End must be after start',true);
  try{await api('records/'+kind+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body});closeModal();await refresh();notify('Record saved')}catch(err){notify(err.message,true)}
 };
}

function optionsByType(type){if(type==='leadStatus')return STATUS.leads.map(s=>[s,t(s)]);if(type==='dealStatus')return STATUS.deals.map(s=>[s,t(s)]);if(type==='taskStatus')return STATUS.tasks.map(s=>[s,t(s)]);if(type==='priority')return ['low','medium','high'].map(s=>[s,t(s)]);if(type==='source')return [['',t('choose')],...SOURCES.map(([v,k])=>[v,t(k)])];if(type==='client')return [['',t('selectClient')],...data.clients.map(c=>[c.id,c.name])];if(type==='lead')return [['',t('selectLead')],...data.leads.map(c=>[c.id,c.name])];if(type==='service')return [['',t('choose')],...data.settings.services.map(s=>[s,s])];if(type==='relation')return [['',t('none')],...['leads','clients','deals'].flatMap(k=>data[k].map(v=>[`${k.slice(0,-1)}|${v.id}`,`${t(k.slice(0,-1))}: ${v.name||v.title}`]))];return [];}
function formField(key,type,required,obj){let value=key==='linkedRef'?obj?.linkedType&&obj?.linkedId?`${obj.linkedType}|${obj.linkedId}`:'':fieldVal(obj,key);if(type==='priority'&&!value)value='medium';if(type==='taskStatus'&&!value)value='open';if(type==='leadStatus'&&!value)value='new';if(type==='dealStatus'&&!value)value='new';
 const nameLabel=(key==='title'&&modal?.kind==='tasks')?t('taskTitle'):(key==='title'&&modal?.kind==='deals')?t('dealTitle'):(key==='value')?`${t('value')} (${data.settings.currency})`:t(key);
 const attr=`id="f-${key}" name="${key}" ${required?'required':''}`;
 let inp;if(['leadStatus','dealStatus','taskStatus','priority','source','client','lead','relation','service'].includes(type)){inp=`<select ${attr}>${options(optionsByType(type),value)}</select>`;}
 else if(type==='textarea')inp=`<textarea ${attr} maxlength="6000">${e(value)}</textarea>`;
 else inp=`<input ${attr} value="${e(value)}" type="${type==='date'?'date':type==='number'?'number':type==='tel'?'tel':type==='email'?'email':'text'}" ${type==='number'?'min="0" step="0.01"':`maxlength="500"`} ${['email','tel'].includes(type)?'class="ltr"':''}>`;
 return `<div class="field ${type==='textarea'||key==='title'?'full':''}"><label for="f-${key}">${e(nameLabel)}${required?' *':''}</label>${inp}</div>`;
}
function modalWindow(title,body,footer){modal={...(modal||{}),title};document.body.insertAdjacentHTML('beforeend',`<div class="backdrop" id="modalLayer"><div class="dialog" role="dialog" aria-modal="true" aria-label="${e(title)}"><div class="dialog-head"><h3>${e(title)}</h3><button type="button" class="btn neutral icon-only" data-action="closeModal">✕</button></div><div class="dialog-body">${body}</div><div class="dialog-footer">${footer}</div></div></div>`);}
function closeModal(){const node=$('#modalLayer');if(node)node.remove();modal=null;}
function openForm(kind,id=null){closeModal();const obj=id?data[kind].find(x=>x.id===id):{};if(id&&!obj)return;modal={kind,id};const name=id?t('editEntry'):t('newEntry');let body=`<form id="recordForm"><div class="form-grid">${FIELDS[kind].map(([key,type,required])=>formField(key,type,required,obj)).join('')}</div></form>`;
 modalWindow(`${name} · ${t(kind)}`,body,`<button class="btn neutral" data-action="closeModal">${e(t('cancel'))}</button><button class="btn primary" type="submit" form="recordForm">${e(t(id?'save':'create'))}</button>`);
 $('#recordForm').addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target),payload=Object.fromEntries(f.entries());if(kind==='tasks'){const ref=payload.linkedRef||'';delete payload.linkedRef;[payload.linkedType,payload.linkedId]=ref?ref.split('|'):['',''];}if(kind==='deals')payload.value=Number(payload.value||0);try{if(id)await api(`records/${kind}/${encodeURIComponent(id)}`,{method:'PUT',body:payload});else await api(`records/${kind}`,{method:'POST',body:payload});closeModal();await refresh();notify(t(id?'updated':'created'));}catch(err){notify(err.message,true);}});
}
function openUserForm(){closeModal();modal={kind:'users'};const body=`<form id="newUserForm" class="settings-form"><div class="field"><label>${e(t('fullName'))}</label><input name="name" minlength="2" required maxlength="100"></div><div class="field"><label>${e(t('username'))}</label><input class="ltr" name="username" required pattern="[A-Za-z0-9_.-]{3,40}"></div><div class="field"><label>${e(t('role'))}</label><select name="role">${options([['staff',t('staff')],['admin',t('admin')]],'staff')}</select></div><div class="field"><label>${e(t('password'))}</label><input type="password" name="password" minlength="12" required autocomplete="new-password"><small>${e(t('passwordHint'))}</small></div></form>`;
 modalWindow(t('createUser'),body,`<button class="btn neutral" data-action="closeModal">${e(t('cancel'))}</button><button class="btn primary" type="submit" form="newUserForm">${e(t('create'))}</button>`);
 $('#newUserForm').addEventListener('submit',async ev=>{ev.preventDefault();try{await api('users',{method:'POST',body:Object.fromEntries(new FormData(ev.target))});closeModal();await refresh();notify(t('userCreated'));}catch(err){notify(err.message,true);}});
}
async function refresh(){await loadData();render();}
async function changeUser(id,changes){try{await api(`users/${id}`,{method:'PATCH',body:changes});await refresh();notify(t('userUpdated'));}catch(err){notify(err.message,true);}}
async function saveSettings(ev){ev.preventDefault();const f=new FormData(ev.target),values={company:f.get('company'),currency:f.get('currency'),services:String(f.get('services')).split('\n').map(x=>x.trim()).filter(Boolean)};try{await api('settings',{method:'PUT',body:values});await refresh();notify(t('saved'));}catch(err){notify(err.message,true);}}
async function download(path,filename){try{const res=await fetch('/api/'+path,{credentials:'same-origin'});if(!res.ok)throw Error(t('error'));const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(err){notify(err.message,true);}}
async function importFile(ev){const f=ev.target.files[0];if(!f)return;ev.target.value='';if(!confirm(t(importMode==='merge'?'mergeConfirm':'restoreConfirm')))return;try{if(f.size>5_000_000)throw Error('File too large');const raw=await f.text();JSON.parse(raw);const res=await api('import?mode='+importMode,{method:'POST',body:raw,json:false});await refresh();notify((importMode==='merge'?t('mergedBackup'):t('dataImported'))+' '+res.imported+' / '+(res.skipped||0));}catch(err){notify(err.message,true);}}

function showSearchHits(term){const hits=$('#globalHits');if(!hits)return;term=norm(term).trim();if(!term){hits.classList.add('hide');hits.innerHTML='';return;}
 const results=[];
 for(const k of ['leads','clients','deals','tasks'])for(const rec of data[k])if(norm(Object.values(rec).join(' ')).includes(term))results.push({kind:k,id:rec.id,title:rec.name||rec.title||''});
 hits.innerHTML=results.length?results.slice(0,9).map(r=>`<button type="button" data-action="searchHit" data-kind="${r.kind}" data-id="${e(r.id)}"><strong>${e(r.title)}</strong><small>${e(t(r.kind))}</small></button>`).join(''):`<div class="hit-empty">${e(t('searchNoResults'))}</div>`;
 hits.classList.remove('hide');
}
function openMyPassword(){closeModal();modal={kind:'password'};
 const body=`<form id="passwordForm" class="settings-form"><div class="field"><label for="pw-current">${e(t('currentPassword'))}</label><input id="pw-current" name="current" type="password" required autocomplete="current-password"></div><div class="field"><label for="pw-new">${e(t('newPassword'))}</label><input id="pw-new" name="password" type="password" minlength="12" required autocomplete="new-password"><small>${e(t('passwordHint'))}</small></div></form>`;
 modalWindow(t('changeMyPassword'),body,`<button class="btn neutral" data-action="closeModal">${e(t('cancel'))}</button><button class="btn primary" type="submit" form="passwordForm">${e(t('save'))}</button>`);
 $('#passwordForm').addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{await api('account/password',{method:'POST',body:{current:f.get('current'),password:f.get('password')}});closeModal();user=null;csrf=null;data=null;renderAuth(false);notify(t('passwordChanged'));}catch(err){notify(err.message,true);}});
}

async function handleAction(action,el){const kind=el.dataset.kind,id=el.dataset.id;try{if(action==='newEvent'){eventEditor();return}if(action==='editEvent'){eventEditor(id);return}if(action==='eventICS'){eventICS(id);return}if(action==='inviteMember'){teamInvite();return}if(action==='editMember'){teamEdit(id);return}if(action==='removeMember'){if(!confirm('Revoke this employee\'s CRM access?'))return;await api('team',{method:'POST',body:{action:'remove',userId:id}});await refresh();notify('Access revoked');return}if(action==='markNotice'){await api('notifications/'+id,{method:'PATCH',body:{}});await refresh();return}if(action==='opsStock'){opsStock();return}if(action==='opsNew'||action==='opsEdit'){opsEditor(kind,action==='opsEdit'?id:null);return}if(action==='createEstimate'){invoiceEditor(null,{docType:'estimate'});return}if(action==='createInvoice'){invoiceEditor();return}
 if(action==='convertEstimate'||action==='duplicateDocument'){
  const original=(data.documents||[]).find(x=>x.id===id);
  if(!original)return notify('Document unavailable.',true);
  const toInvoice=action==='convertEstimate';
  const newType=toInvoice?'invoice':original.docType;
  invoiceEditor(null,{...original,id:null,number:docId(newType),docType:newType,status:'draft',items:original.items});
  return;
 }
 if(action==='invoicePay'){invoicePayment(id);return}if(action==='invoicePrint'){invoicePrint(id);return}if(action==='wzAdd'||action==='wzEdit'){wzForm(kind,action==='wzEdit'?id:null);return}if(action==='wzMonth'){wzOffset=el.dataset.step==='0'?0:wzOffset+Number(el.dataset.step);renderContent();return}
 if(action==='searchHit'){page=kind;query='';filter='all';render();openForm(kind,id);return;}
 if(action==='myPassword'){if(window.__NEXA_OFFLINE__){notify(t('offlineNotice'));return;}openMyPassword();return;}
 if(action==='menu'){menuOpen=!menuOpen;render();return;}
 if(action==='closeMenu'){menuOpen=false;render();return;}
 if(action==='emailNavigate'){emailTab=el.dataset.tab||'overview';renderContent();if(emailTab==='inbox'&&!emailInboxCache)await emailFetchInbox();return;}
 if(action==='emailStarMessage'){if(emailLocalStarred.has(id))emailLocalStarred.delete(id);else emailLocalStarred.add(id);emailSelectedId=id;renderContent();return;}
 if(action==='emailCopyMessage'){const x=(emailInboxCache||[]).find(v=>v.id===id);if(x){await navigator.clipboard.writeText('From: '+(x.from||'')+'\nSubject: '+(x.subject||'')+'\nDate: '+(x.date||'')+'\n\n'+(x.snippet||''));notify('Message preview copied.');}return;}
 if(action==='emailComposeSend'){
  if(!['owner','admin'].includes(user.role))throw Error('Admin access required');
  const f=$('#emailDraftForm');if(!f)return notify('Compose form not found.',true);
  const toField=f.elements.namedItem('recipientEmail'),subjectField=f.elements.namedItem('subject'),bodyField=f.elements.namedItem('body');
  const to=String(toField?.value||'').trim(),subject=String(subjectField?.value||'').trim(),body=String(bodyField?.value||'').trim();
  const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!to||!emailPattern.test(to)){toField.setCustomValidity('Enter a valid recipient email.');toField.reportValidity();toField.focus();return;}
  if(!subject){subjectField.setCustomValidity('Enter an email subject.');subjectField.reportValidity();subjectField.focus();return;}
  if(!body){bodyField.setCustomValidity('Write your email message.');bodyField.reportValidity();bodyField.focus();return;}
  if(!f.reportValidity())return;
  if(!confirm('Send a real email from nexabridgeops@gmail.com?\n\nTo: '+to+'\nSubject: '+subject+'\n\nConfirm to send now.'))return;
  const button=el;button.disabled=true;const label=button.textContent;button.textContent='Sending…';
  try{const result=await gmailCall('send',{to,subject,body,requestId:crypto.randomUUID()});if(!result.sent)throw Error('Gmail did not confirm sending.');f.reset();notify('Gmail accepted the email. Check Sent in Gmail.');}
  finally{button.disabled=false;button.textContent=label;}return;
 }
 if(action==='emailSelectMessage'){emailSelectedId=id;renderContent();return;}
 if(action==='emailRefreshInbox'){await emailFetchInbox();return;}
 if(action==='emailCheckConnection'){emailConnection=await gmailCall('status');renderContent();notify(emailConnection.message||'Connection checked',!emailConnection.configured);return;}
 if(action==='gmailStatus'){const result=await gmailCall('status');notify(result.message||'Gmail status checked',!result.configured);return;}
 if(action==='gmailInbox'){await gmailShowInbox();return;}
 if(action==='gmailReply'){const body=prompt('Reply message (will be sent through Gmail after confirmation):');if(!body||!body.trim())return;if(!confirm('Send this reply now?'))return;const result=await gmailCall('reply',{id,body:body.trim(),requestId:crypto.randomUUID()});if(result.sent){closeModal();notify('Gmail accepted the reply.');}return;}
 
 if(action==='gmailSendDraft'){await gmailSendExistingDraft(id);return;}
 if(action==='emailDraftEdit'){emailEditor('email_queue',id);return;}
 if(action==='emailTemplateEdit'){emailEditor('email_templates',id);return;}
 if(action==='emailTemplateUse'){const t=(data.email_templates||[]).find(x=>x.id===id);if(t)emailEditor('email_queue',null,{subject:t.subject,body:t.body});return;}
 if(action==='emailDraftHandoff'){const d=(data.email_queue||[]).find(x=>x.id===id);if(!d)throw Error('Draft not found');openEmailApp(d.recipientEmail,d.subject,d.body);return;}
 if(action==='invoiceSendGmail'){await invoiceSendGmail(id);return;}
 if(action==='invoiceEmail'){invoiceEmailHandoff(id);return;}
 if(action==='emailDraftCopy'){const d=(data.email_queue||[]).find(x=>x.id===id);if(d){await navigator.clipboard.writeText('To: '+d.recipientEmail+'\nSubject: '+d.subject+'\n\n'+d.body);notify('Copied');}return;}
 if(action==='emailDraftDelete'){if(!['owner','admin'].includes(user.role))throw Error('Admin access required');if(!confirm('Permanently delete this email draft?'))return;await api('records/email_queue/'+encodeURIComponent(id),{method:'DELETE'});await refresh();notify('Draft deleted');return;}
 if(action==='emailTemplateDelete'){if(!['owner','admin'].includes(user.role))throw Error('Admin access required');if(!confirm('Delete this email template?'))return;await api('records/email_templates/'+encodeURIComponent(id),{method:'DELETE'});await refresh();notify('Deleted');return;}
 if(action==='extensionEdit'){extensionEdit(kind,id);return;}if(action==='extensionDelete'){if(!['owner','admin'].includes(user.role))throw Error('Administrator access required');if(!confirm('Permanently delete this record?'))return;await api('records/'+kind+'/'+encodeURIComponent(id),{method:'DELETE'});await refresh();notify('Deleted');return;}if(action==='page'){if(el.dataset.page==='email')emailTab='overview';page=el.dataset.page;query='';filter='all';menuOpen=false;render();scrollTo({top:0,behavior:'smooth'});return;}
 if(action==='goClients'){page='clients';query='';filter='all';render();return;}
 if(action==='logout'){if(window.__NEXA_OFFLINE__){notify(t('offlineNotice'));return;}if(!confirm(t('logoutConfirm')))return;await api('logout',{method:'POST',body:{}});user=null;csrf=null;data=null;renderAuth(false);return;}
 if(action==='add'){openForm(kind);return;}
 if(action==='addUser'){openUserForm();return;}
 if(action==='edit'){openForm(kind,id);return;}
 if(action==='closeModal'){closeModal();return;}
 if(action==='deleteInvoice'){const doc=data.documents.find(d=>d.id===id);if(!doc)throw Error('Invoice or estimate not found.');if((data.payments||[]).some(p=>p.document_id===id))throw Error('This document has recorded payments and cannot be deleted.');if(!confirm('Permanently delete '+(doc.number||'this document')+'? This cannot be undone.'))return;await api('records/documents/'+encodeURIComponent(id),{method:'DELETE'});await refresh();notify('Document deleted successfully.');return;}
 if(action==='delete'){if(!['owner','admin'].includes(user.role))throw Error('Administrator access required.');if(!confirm(t('confirmDelete')))return;await api(`records/${kind}/${encodeURIComponent(id)}`,{method:'DELETE'});await refresh();notify(t('deleted'));return;}
 if(action==='convert'){if(!confirm(t('confirmConvert')))return;await api(`convert/${id}`,{method:'POST',body:{}});await refresh();notify(t('convertedToast'));return;}
 if(action==='toggleTask'){let obj=data.tasks.find(x=>x.id===id);await api(`records/tasks/${id}`,{method:'PUT',body:{status:obj.status==='done'?'open':'done'}});await refresh();notify(t('updated'));return;}
 if(action==='export'){await download('export/'+kind+'.csv','NexaBridge_'+kind+'.csv');return;}
 if(action==='backup'){await download('backup','NexaBridge_CRM_backup.json');return;}
 if(action==='backupStatus'){const b=await api('system/backups');notify(`${t('backupReady')}: ${b.count} · ${t('backupAutomatic')}: ${t(b.automatic?'backupEnabled':'backupDisabled')}`+(b.latest_hours_ago===null?'':` · ${b.latest_hours_ago} ${t('backupHours')}`));return;}
 if(action==='restore'){importMode='replace';$('#restoreFile')?.click();return;}
 if(action==='merge'){importMode='merge';$('#restoreFile')?.click();return;}
 if(action==='toggleUser'){let u=data.users.find(x=>x.id===id);if(!u)return;await changeUser(id,{active:!u.active});return;}
 if(action==='roleUser'){let u=data.users.find(x=>x.id===id);if(!u)return;await changeUser(id,{role:u.role==='admin'?'staff':'admin'});return;}
 if(action==='passwordUser'){const p=prompt(t('newPassword')+' ('+t('passwordHint')+')');if(p===null)return;if(p.length<12){notify(t('passwordHint'),true);return;}await changeUser(id,{password:p});return;}
 }catch(err){notify(err.message,true);}}
 root.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el){ev.preventDefault();handleAction(el.dataset.action,el);}});
 document.addEventListener('change',async ev=>{const el=ev.target;if(el.dataset.action==='dealStage'){try{await api(`records/deals/${el.dataset.id}`,{method:'PUT',body:{stage:el.value}});await refresh();notify(t('updated'));}catch(err){notify(err.message,true);}}});
 document.addEventListener('click',ev=>{if(ev.target.id==='modalLayer')closeModal();const action=ev.target.closest('#modalLayer [data-action]');if(action){ev.preventDefault();handleAction(action.dataset.action,action);}if(!ev.target.closest('.top-search'))$('#globalHits')?.classList.add('hide');});
 document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&document.activeElement?.id==='globalSearch'){const first=$('#globalHits [data-action=searchHit]');if(first){ev.preventDefault();first.click();}}});
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();});
 start();
})();
