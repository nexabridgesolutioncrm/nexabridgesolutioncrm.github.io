 document.addEventListener('change',async ev=>{const el=ev.target;if(el.dataset.action==='dealStage'){try{await api(`records/deals/${el.dataset.id}`,{method:'PUT',body:{stage:el.value}});await refresh();notify(t('updated'));}catch(err){notify(err.message,true);}}});
 document.addEventListener('click',ev=>{if(ev.target.id==='modalLayer')closeModal();const action=ev.target.closest('#modalLayer [data-action]');if(action){ev.preventDefault();handleAction(action.dataset.action,action);}if(!ev.target.closest('.top-search'))$('#globalHits')?.classList.add('hide');});
 document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&document.activeElement?.id==='globalSearch'){const first=$('#globalHits [data-action=searchHit]');if(first){ev.preventDefault();first.click();}}});
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();});
 start();
})();

</script></body></html>
