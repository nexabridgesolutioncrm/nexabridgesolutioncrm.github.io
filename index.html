:root{font:15px system-ui,sans-serif;color:#192540;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header{background:#15213e;color:white;padding:19px max(22px,calc((100% - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:20px;font-weight:750}.tag{font-size:12px;color:#b7c5e0}main{max-width:1150px;margin:30px auto;padding:0 18px}.card{background:white;border:1px solid #e3e8f0;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px #182b5109}.login{max-width:440px;margin:9vh auto}h1{font-size:23px;margin:0 0 7px}h2{font-size:19px}p{color:#657187}label{display:block;margin:12px 0 5px;font-weight:600;font-size:13px}input,select,textarea{width:100%;border:1px solid #cfd7e5;border-radius:9px;background:white;padding:11px;color:#162444;font:inherit}textarea{min-height:76px}button{border:0;background:#5546d6;color:white;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:650}button:hover{filter:brightness(.95)}button:disabled{opacity:.6;cursor:wait}.secondary{background:#eaf0fa;color:#22365b}.danger{background:#fff0f1;color:#b62848}.small{padding:7px 11px;font-size:12px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}nav button{background:#e9ecf5;color:#344361}nav button.active{background:#5546d6;color:white}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.summary .card{font-size:28px;font-weight:750}.summary span{display:block;font-size:12px;font-weight:500;color:#657187}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f6}th{font-size:12px;color:#67748a}td{font-size:13px}.scroll{overflow:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 17px}.fields .wide{grid-column:1/-1}.muted{color:#76829a}.notice{padding:13px;background:#e9f6f1;border-radius:9px;color:#177459;font-size:13px}.error{background:#ffecee;color:#a31c40}.rowbtn{margin:2px}.hidden{display:none!important}#message{margin:12px 0;min-height:20px}footer{font-size:12px;color:#8290a6;text-align:center;padding:24px}@media(max-width:700px){.fields,.summary{grid-template-columns:1fr 1fr}header{padding:17px}h1{font-size:20px}}@media(max-width:420px){.fields,.summary{grid-template-columns:1fr}}
</style></head><body><header><div><div class="logo">NexaBridge Solutions</div><div class="tag">Secure CRM · Online Beta</div></div><button id="signout" class="secondary small hidden">Sign out</button></header><main><div id="login" class="card login"><h1>Sign in to CRM</h1><p>Authorized NexaBridge team members only.</p><form id="loginform"><label for="email">Work email</label><input id="email" type="email" required autocomplete="username" placeholder="name@company.com"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><div style="margin-top:18px"><button type="submit" id="loginbtn">Sign in securely</button></div></form><div id="loginerror" role="alert"></div></div><section id="workspace" class="hidden"><div class="top"><div><h1>CRM Workspace</h1><p id="identity"></p></div><div class="notice">Internal beta · Data protected by Supabase RLS</div></div><div class="summary" id="summary"></div><nav id="tabs"></nav><div class="card"><div class="top"><h2 id="sectiontitle">Leads</h2><button id="add">+ New record</button></div><div id="message"></div><div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></section><div id="editor" class="card hidden"><h2 id="editortitle">New record</h2><form id="recordform"><div id="fields" class="fields"></div><div style="margin-top:19px;display:flex;gap:10px"><button type="submit" id="save">Save</button><button type="button" class="secondary" id="cancel">Cancel</button></div></form></div></main><footer>© NexaBridge Solutions · Private business application · Beta</footer><script>
(()=>{'use strict';
const BASE='https://eahoudfosrblcsbjgjoa.supabase.co',KEY='sb_publishable_kxVCDTegJm-_nRrvaBAzrw_hbMPoG_5';
const TABLES={Leads:'crm_leads',Clients:'crm_clients',Deals:'crm_deals',Tasks:'crm_tasks'};
const SCHEMA={
Leads:[['name','Name','text',true],['company','Company'],['email','Email','email'],['phone','Phone','tel'],['source','Source'],['interest','Interest'],['status','Status','select:new,contacted,qualified,converted,closed'],['followup','Follow-up','date'],['owner','Assigned to'],['notes','Notes','textarea']],
Clients:[['name','Client name','text',true],['contact','Contact person'],['email','Email','email'],['phone','Phone','tel'],['industry','Industry'],['notes','Notes','textarea']],
Deals:[['title','Deal title','text',true],['value','Value (USD)','number'],['stage','Stage','select:new,proposal,negotiation,won,lost'],['service','Service'],['close_date','Close date','date'],['notes','Notes','textarea']],
Tasks:[['title','Task title','text',true],['priority','Priority','select:low,medium,high'],['status','Status','select:open,done'],['due_date','Due date','date'],['notes','Notes','textarea']]
};
const $=id=>document.getElementById(id);let session=null,org=null,role='',kind='Leads',rows=[],editing=null;
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(s,error=false){$('message').textContent=s;$('message').className=error?'notice error':'notice'}
async function req(path,{method='GET',body,authenticated=true,prefer}={}){
const h={'apikey':KEY};if(authenticated){if(!session?.access_token)throw Error('Session expired. Sign in again.');h.Authorization='Bearer '+session.access_token}
if(body!==undefined)h['Content-Type']='application/json';if(prefer)h.Prefer=prefer;
const res=await fetch(BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}
if(!res.ok)throw Error(data?.msg||data?.message||data?.error_description||data?.error||'Request failed: '+res.status);return data}
async function login(email,password){const s=await req('/auth/v1/token?grant_type=password',{authenticated:false,method:'POST',body:{email,password}});session={access_token:s.access_token,refresh_token:s.refresh_token};try{const me=await req('/auth/v1/user');const member=await req('/rest/v1/crm_members?select=org_id,role&user_id=eq.'+encodeURIComponent(me.id));if(!member?.length)throw Error('This account is not authorized for NexaBridge CRM.');const orgs=await req('/rest/v1/crm_organizations?select=id,name&id=eq.'+member[0].org_id);if(orgs?.[0]?.name!=='NexaBridge Solutions')throw Error('Incorrect organization.');org=member[0].org_id;role=member[0].role;$('identity').textContent=me.email+' · '+role;$('login').classList.add('hidden');$('workspace').classList.remove('hidden');$('signout').classList.remove('hidden');await load()}catch(e){session=null;org=null;throw e}}
async function load(){let all=await Promise.all(Object.keys(TABLES).map(async n=>{const r=await req('/rest/v1/'+TABLES[n]+'?select=id&org_id=eq.'+org);return [n,r.length]}));$('summary').innerHTML=all.map(([name,count])=>'<div class="card">'+count+'<span>'+name+'</span></div>').join('');await show(kind)}
async function show(n){kind=n;const t=TABLES[kind];$('tabs').innerHTML=Object.keys(TABLES).map(k=>'<button data-tab="'+k+'" class="'+(k===kind?'active':'')+'">'+k+'</button>').join('');$('sectiontitle').textContent=kind;$('message').textContent='';rows=await req('/rest/v1/'+t+'?select=*&org_id=eq.'+org+'&order=created_at.desc');let columns=SCHEMA[kind].slice(0,5).map(f=>f[0]);$('thead').innerHTML='<tr>'+columns.map(k=>'<th>'+escape(k.replaceAll('_',' '))+'</th>').join('')+'<th>Actions</th></tr>';$('tbody').innerHTML=rows.length?rows.map(r=>'<tr>'+columns.map(k=>'<td>'+escape(r[k])+'</td>').join('')+'<td><button class="secondary small rowbtn" data-edit="'+escape(r.id)+'">Edit</button> <button class="danger small rowbtn" data-delete="'+escape(r.id)+'">Delete</button></td></tr>').join(''):'<tr><td colspan="8" class="muted">No records yet</td></tr>'}
function editor(r){editing=r?.id||null;$('editor').classList.remove('hidden');$('workspace').classList.add('hidden');$('editortitle').textContent=(editing?'Edit ':'New ')+kind.slice(0,-1);$('fields').innerHTML='';for(const [name,label,type='text',required=false] of SCHEMA[kind]){const wrap=document.createElement('div');if(type==='textarea')wrap.className='wide';const lab=document.createElement('label');lab.textContent=label;wrap.appendChild(lab);let input;if(type==='textarea'){input=document.createElement('textarea')}else if(type.startsWith('select:')){input=document.createElement('select');for(const opt of type.slice(7).split(',')){let el=document.createElement('option');el.value=opt;el.textContent=opt;input.appendChild(el)}}else{input=document.createElement('input');input.type=type;if(type==='number'){input.min='0';input.step='0.01'}}input.name=name;input.required=required;input.value=r?.[name]??'';wrap.appendChild(input);$('fields').appendChild(wrap)}}
async function save(e){e.preventDefault();const data=Object.fromEntries(new FormData($('recordform')).entries());for(const f of SCHEMA[kind]){if(f[2]==='date'&&data[f[0]]==='')data[f[0]]=null}if(kind==='Deals')data.value=Number(data.value||0);const path='/rest/v1/'+TABLES[kind];$('save').disabled=true;try{if(editing){await req(path+'?id=eq.'+editing+'&org_id=eq.'+org,{method:'PATCH',body:data,prefer:'return=minimal'})}else{data.org_id=org;await req(path,{method:'POST',body:data,prefer:'return=minimal'})}closeEditor();await load();message('Record saved successfully.')}catch(err){alert(err.message)}finally{$('save').disabled=false}}
function closeEditor(){$('editor').classList.add('hidden');$('workspace').classList.remove('hidden')}
$('loginform').onsubmit=async e=>{e.preventDefault();$('loginbtn').disabled=true;$('loginerror').textContent='';try{await login($('email').value.trim(),$('password').value);$('password').value=''}catch(err){$('loginerror').className='notice error';$('loginerror').textContent=err.message}finally{$('loginbtn').disabled=false}};
$('signout').onclick=async()=>{try{await req('/auth/v1/logout',{method:'POST'})}catch{}session=null;org=null;$('workspace').classList.add('hidden');$('editor').classList.add('hidden');$('signout').classList.add('hidden');$('login').classList.remove('hidden')};
$('tabs').onclick=e=>{let b=e.target.closest('button[data-tab]');if(b)show(b.dataset.tab).catch(err=>message(err.message,true))};
$('tbody').onclick=async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){editor(rows.find(r=>r.id===edit.dataset.edit));return}if(del&&confirm('Delete this record permanently?')){try{await req('/rest/v1/'+TABLES[kind]+'?id=eq.'+del.dataset.delete+'&org_id=eq.'+org,{method:'DELETE'});await load();message('Record deleted.')}catch(err){message(err.message,true)}}};
$('add').onclick=()=>editor(null);$('cancel').onclick=closeEditor;$('recordform').onsubmit=save;
})();
</script></body></html>
